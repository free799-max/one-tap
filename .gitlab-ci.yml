# 推送 v* 版本标签时构建并推送 OneTap 镜像到 Harbor。
#
# 触发方式：只在推送 v主.次.修订 标签时运行（由 scripts/release.sh 生成并推送），
# 分支推送、合并请求、手动运行都不会触发，避免每次提交都重新构建。
#
# 基础镜像 harbor.cacty.top/library/onetap-base 由 docker/base.Dockerfile 手动
# 构建并推送，流水线只拉取使用，不构建它。
#
# 目标 Runner 使用 shell executor（在宿主机上直接执行），所以这里不声明
# image / services，也不设置 DOCKER_HOST：直接使用宿主机安装的 Docker 与 buildx。
# 如果改用 docker executor，需要恢复 docker:dind 服务并设置 DOCKER_HOST。
#
# 推送 Harbor 使用 Runner 宿主机上已有的 Docker 登录状态（需提前在该机器执行
# docker login harbor.cacty.top），流水线本身不接收 Harbor 账号密码。
# 同时推送腾讯云 CCR（ccr.ccs.tencentyun.com/one-tap/one-tap）：在 GitLab
# 项目设置里配置 TENCENT_REGISTRY_USERNAME / TENCENT_REGISTRY_PASSWORD 两个
# CI/CD 变量即可；未配置时沿用 Runner 宿主机上已有的 docker login 状态。
#
# 构建只用 Harbor 上的镜像（基础镜像与 baseimg 上游镜像），Runner 不访问 docker.io。

stages:
  - image

variables:
  HARBOR_REGISTRY: harbor.cacty.top
  HARBOR_PROJECT: library
  APP_IMAGE_NAME: onetap
  TENCENT_REGISTRY: ccr.ccs.tencentyun.com
  TENCENT_PROJECT: one-tap
  TENCENT_IMAGE_NAME: one-tap
  BASE_IMAGE: harbor.cacty.top/library/onetap-base:latest
  NODE_IMAGE: harbor.cacty.top/baseimg/node:22-alpine
  # 构建前替换后端配置默认值；运行时环境变量仍可覆盖
  # 逗号分隔多个地址，前一个不可用时后端自动重试下一个
  MANAGE_BASE_URL: https://m.one-tap.vip,https://m.one-tab.vip
  MANAGE_SYNC_INTERVAL_MINUTES: "30"
  MANAGE_SYNC_ON_STARTUP: "True"
  # NAS 为 ARM 时改为 linux/arm64
  PLATFORMS: linux/amd64

workflow:
  rules:
    # 只响应语义化版本标签；其余情况一律不创建流水线
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/
    - when: never

.docker:
  before_script:
    - docker version
    - docker buildx version

app-image:
  extends: .docker
  stage: image
  script:
    - |
      APP_REF="$HARBOR_REGISTRY/$HARBOR_PROJECT/$APP_IMAGE_NAME"
      TENCENT_REF="$TENCENT_REGISTRY/$TENCENT_PROJECT/$TENCENT_IMAGE_NAME"
      TAG="$CI_COMMIT_TAG"
      TAGS="--tag $APP_REF:$TAG --tag $TENCENT_REF:$TAG"
      # 正式版本额外打 latest；预发布标签（如 v1.0.0-rc.1）只保留自身
      if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        TAGS="$TAGS --tag $APP_REF:latest --tag $TENCENT_REF:latest"
      fi
      echo "本次构建标签：$TAGS"
      # 腾讯云 CCR 需要登录：优先用 CI/CD 变量，未配置时沿用宿主机的登录状态
      if [ -n "${TENCENT_REGISTRY_USERNAME:-}" ] && [ -n "${TENCENT_REGISTRY_PASSWORD:-}" ]; then
        printf '%s' "$TENCENT_REGISTRY_PASSWORD" | docker login "$TENCENT_REGISTRY" -u "$TENCENT_REGISTRY_USERNAME" --password-stdin
      fi
      sed -i \
        -e "s|^    MANAGE_BASE_URL: str = .*|    MANAGE_BASE_URL: str = \"$MANAGE_BASE_URL\"|" \
        -e "s|^    MANAGE_SYNC_INTERVAL_MINUTES: int = .*|    MANAGE_SYNC_INTERVAL_MINUTES: int = $MANAGE_SYNC_INTERVAL_MINUTES|" \
        -e "s|^    MANAGE_SYNC_ON_STARTUP: bool = .*|    MANAGE_SYNC_ON_STARTUP: bool = $MANAGE_SYNC_ON_STARTUP|" \
        backend/app/config.py
      docker buildx create --use --name onetap --driver docker-container >/dev/null 2>&1 || docker buildx use onetap
      docker buildx build \
        --platform "$PLATFORMS" \
        --build-arg "BASE_IMAGE=$BASE_IMAGE" \
        --build-arg "NODE_IMAGE=$NODE_IMAGE" \
        --build-arg "APP_VERSION=$CI_COMMIT_TAG" \
        --label "org.opencontainers.image.title=OneTap" \
        --label "org.opencontainers.image.version=$TAG" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --cache-from "type=registry,ref=$APP_REF:buildcache" \
        --cache-to "type=registry,ref=$APP_REF:buildcache,mode=max" \
        $TAGS \
        --push .
      echo "已推送：$APP_REF:$TAG"
      echo "已推送：$TENCENT_REF:$TAG"
